<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚡ Kraken Sentinel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.8.0/Recharts.js"></script>
<style>
  :root {
    --bg:        #060a0f;
    --bg2:       #0a1018;
    --bg3:       #0d1520;
    --border:    #1a2a3a;
    --border2:   #243545;
    --cyan:      #00d4ff;
    --cyan2:     #00a8cc;
    --green:     #00ff9d;
    --green2:    #00cc7a;
    --red:       #ff3d5a;
    --red2:      #cc2244;
    --yellow:    #ffd700;
    --orange:    #ff8c00;
    --purple:    #a855f7;
    --text:      #c8d8e8;
    --text2:     #7a99b8;
    --text3:     #445566;
    --glow-c:    0 0 20px rgba(0,212,255,0.3);
    --glow-g:    0 0 20px rgba(0,255,157,0.3);
    --glow-r:    0 0 20px rgba(255,61,90,0.3);
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px;
    overflow-x: hidden;
    min-height: 100vh;
  }

  /* Animated grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* Scan line effect */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.05) 2px,
      rgba(0,0,0,0.05) 4px
    );
    pointer-events: none;
    z-index: 0;
  }

  #root { position: relative; z-index: 1; }

  /* ── Header ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 24px;
    background: linear-gradient(180deg, rgba(0,212,255,0.08) 0%, transparent 100%);
    border-bottom: 1px solid var(--border2);
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
  }

  .logo {
    font-family: 'Orbitron', monospace;
    font-size: 20px;
    font-weight: 900;
    color: var(--cyan);
    text-shadow: var(--glow-c);
    letter-spacing: 3px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-sub {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--text2);
    letter-spacing: 2px;
  }

  .status-bar {
    display: flex;
    gap: 24px;
    align-items: center;
  }

  .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }

  .stat-val {
    font-family: 'Orbitron', monospace;
    font-size: 16px;
    font-weight: 700;
    color: var(--cyan);
  }

  .stat-lbl {
    font-size: 10px;
    color: var(--text3);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .live-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: var(--glow-g);
    animation: pulse 1.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }

  /* ── Layout ── */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: auto auto auto;
    gap: 12px;
    padding: 12px;
  }

  .card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
    position: relative;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--cyan), transparent);
    opacity: 0.4;
  }

  .card-header {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(0,212,255,0.03);
  }

  .card-title {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--cyan2);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .card-body { padding: 12px 14px; }

  /* ── Price Cards ── */
  .price-cards {
    grid-column: span 3;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
  }

  .price-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 16px;
    position: relative;
    overflow: hidden;
    transition: border-color 0.3s;
  }

  .price-card.bullish { border-color: rgba(0,255,157,0.3); }
  .price-card.bearish { border-color: rgba(255,61,90,0.3); }

  .price-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
  }
  .price-card.bullish::before { background: linear-gradient(90deg, transparent, var(--green), transparent); }
  .price-card.bearish::before { background: linear-gradient(90deg, transparent, var(--red), transparent); }
  .price-card.neutral::before { background: linear-gradient(90deg, transparent, var(--cyan), transparent); }

  .pair-name {
    font-family: 'Orbitron', monospace;
    font-size: 13px;
    font-weight: 700;
    color: var(--text2);
    letter-spacing: 2px;
    margin-bottom: 8px;
  }

  .price-val {
    font-family: 'Orbitron', monospace;
    font-size: 24px;
    font-weight: 900;
    color: var(--cyan);
    text-shadow: var(--glow-c);
    line-height: 1;
    margin-bottom: 8px;
  }

  .price-change {
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .up { color: var(--green); }
  .down { color: var(--red); }
  .neutral-c { color: var(--text2); }

  .price-meta {
    margin-top: 10px;
    display: flex;
    gap: 16px;
    font-size: 11px;
    color: var(--text3);
    font-family: 'Share Tech Mono', monospace;
  }

  /* ── Trade Feed ── */
  .trade-feed {
    grid-column: span 1;
    grid-row: span 2;
  }

  .trade-row {
    display: grid;
    grid-template-columns: 80px 50px 1fr 80px;
    gap: 8px;
    padding: 5px 0;
    border-bottom: 1px solid rgba(26,42,58,0.5);
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    align-items: center;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateX(-8px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .trade-pair { color: var(--text2); font-size: 11px; }
  .trade-buy { color: var(--green); }
  .trade-sell { color: var(--red); }
  .trade-price { color: var(--text); text-align: right; }
  .trade-vol { color: var(--text3); text-align: right; font-size: 11px; }

  /* ── Alert Log ── */
  .alert-log { grid-column: span 2; }

  .alert-row {
    padding: 10px 12px;
    border-radius: 3px;
    margin-bottom: 8px;
    border-left: 3px solid;
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    animation: slideIn 0.4s ease;
    position: relative;
    overflow: hidden;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .alert-whale {
    background: rgba(168,85,247,0.08);
    border-color: var(--purple);
    color: var(--purple);
  }

  .alert-sweep-buy {
    background: rgba(0,255,157,0.06);
    border-color: var(--green);
    color: var(--green);
  }

  .alert-sweep-sell {
    background: rgba(255,61,90,0.06);
    border-color: var(--red);
    color: var(--red);
  }

  .alert-bot {
    background: rgba(255,215,0,0.06);
    border-color: var(--yellow);
    color: var(--yellow);
  }

  .alert-time {
    color: var(--text3);
    font-size: 10px;
    margin-bottom: 3px;
  }

  .alert-msg { line-height: 1.4; }

  /* ── Agent Commentary ── */
  .agent-panel { grid-column: span 2; }

  .commentary-box {
    background: var(--bg3);
    border: 1px solid var(--border2);
    border-radius: 3px;
    padding: 12px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    color: var(--text);
    line-height: 1.7;
    min-height: 120px;
    position: relative;
  }

  .commentary-box::before {
    content: '> AGENT ANALYSIS';
    position: absolute;
    top: -9px; left: 12px;
    background: var(--bg3);
    padding: 0 6px;
    font-size: 10px;
    color: var(--cyan2);
    letter-spacing: 1px;
  }

  .typing-cursor {
    display: inline-block;
    width: 8px; height: 14px;
    background: var(--cyan);
    animation: blink 1s step-end infinite;
    vertical-align: text-bottom;
    margin-left: 2px;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  /* ── Portfolio ── */
  .portfolio-panel { grid-column: span 1; }

  .pnl-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 7px 0;
    border-bottom: 1px solid var(--border);
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
  }

  .pnl-label { color: var(--text2); }
  .pnl-pos { color: var(--green); }
  .pnl-neg { color: var(--red); }
  .pnl-neu { color: var(--cyan); }

  .pnl-bar-wrap {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin-top: 10px;
    overflow: hidden;
  }

  .pnl-bar {
    height: 100%;
    border-radius: 2px;
    transition: width 0.5s ease;
  }

  /* ── Chart ── */
  .chart-panel { grid-column: span 2; }

  /* ── Futures ── */
  .futures-panel { grid-column: span 1; }

  .futures-row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
  }

  /* ── Signal burst ── */
  .signal-burst {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-family: 'Orbitron', monospace;
    font-size: 32px;
    font-weight: 900;
    pointer-events: none;
    z-index: 999;
    animation: burst 1.5s ease forwards;
  }

  @keyframes burst {
    0% { opacity: 1; transform: translate(-50%, -50%) scale(0.5); }
    30% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
    100% { opacity: 0; transform: translate(-50%, -60%) scale(1.3); }
  }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  .overflow-y { overflow-y: auto; max-height: 300px; }
  .overflow-y-lg { overflow-y: auto; max-height: 420px; }

  .tag {
    display: inline-block;
    padding: 2px 7px;
    border-radius: 2px;
    font-size: 10px;
    font-family: 'Share Tech Mono', monospace;
    letter-spacing: 1px;
  }

  .tag-live { background: rgba(0,255,157,0.15); color: var(--green); }
  .tag-paper { background: rgba(0,212,255,0.15); color: var(--cyan); }
  .tag-futures { background: rgba(168,85,247,0.15); color: var(--purple); }

  .sep { width: 1px; height: 32px; background: var(--border2); }

  .empty { color: var(--text3); font-family: 'Share Tech Mono', monospace; font-size: 12px; text-align: center; padding: 20px; }
</style>
</head>
<body>
<div id="root"></div>

<script>
const { useState, useEffect, useRef, useCallback } = React;
const { LineChart, Line, XAxis, YAxis, Tooltip, ResponsiveContainer, ReferenceLine } = Recharts;

const API = 'http://localhost:7373';
const POLL = 1500;

// ── Formatters ────────────────────────────────────────────── //
const fmt = {
  price: (v, pair) => {
    if (!v) return '—';
    const n = parseFloat(v);
    if (pair && pair.includes('DOG')) return `$${n.toFixed(8)}`;
    if (n > 1000) return `$${n.toLocaleString('en-US', {minimumFractionDigits:1, maximumFractionDigits:1})}`;
    return `$${n.toFixed(2)}`;
  },
  usd: v => v ? `$${parseFloat(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}` : '—',
  pct: v => v ? `${parseFloat(v) >= 0 ? '+' : ''}${parseFloat(v).toFixed(2)}%` : '—',
  time: ts => ts ? new Date(ts).toLocaleTimeString('en-US',{hour12:false}) : '',
};

const signalColor = type => {
  if (!type) return '';
  const t = type.toLowerCase();
  if (t.includes('whale')) return 'alert-whale';
  if (t.includes('sweep') && t.includes('buy')) return 'alert-sweep-buy';
  if (t.includes('sweep')) return 'alert-sweep-sell';
  if (t.includes('bot')) return 'alert-bot';
  return 'alert-bot';
};

const signalEmoji = type => {
  if (!type) return '📡';
  const t = type.toLowerCase();
  if (t.includes('whale')) return '🐳';
  if (t.includes('sweep') && t.includes('buy')) return '🚀';
  if (t.includes('sweep')) return '🔻';
  if (t.includes('bot')) return '🤖';
  return '⚡';
};

// ── Price Card ────────────────────────────────────────────── //
function PriceCard({ pair, data }) {
  const price = data?.prices?.[pair];
  const prev = useRef(price);
  const [flash, setFlash] = useState(null);

  useEffect(() => {
    if (price && prev.current && price !== prev.current) {
      setFlash(parseFloat(price) > parseFloat(prev.current) ? 'up' : 'down');
      setTimeout(() => setFlash(null), 600);
    }
    prev.current = price;
  }, [price]);

  const trades = (data?.trades || []).filter(t => t.symbol === pair);
  const lastTrade = trades[0];
  const recentBuys = trades.slice(0,10).filter(t=>t.side==='buy').length;
  const recentSells = trades.slice(0,10).filter(t=>t.side==='sell').length;
  const bias = recentBuys > recentSells ? 'bullish' : recentSells > recentBuys ? 'bearish' : 'neutral';

  return React.createElement('div', { className: `price-card ${bias}` },
    React.createElement('div', { className: 'pair-name' }, pair),
    React.createElement('div', {
      className: `price-val ${flash === 'up' ? 'up' : flash === 'down' ? 'down' : ''}`,
      style: { transition: 'color 0.3s' }
    }, fmt.price(price, pair)),
    React.createElement('div', { className: 'price-change' },
      React.createElement('span', { className: lastTrade?.side === 'buy' ? 'up' : 'down' },
        lastTrade?.side === 'buy' ? '▲ BUY' : lastTrade?.side === 'sell' ? '▼ SELL' : '—'
      ),
      React.createElement('span', { className: 'neutral-c' },
        lastTrade ? ` ${fmt.usd(lastTrade.volume_usd)}` : ''
      )
    ),
    React.createElement('div', { className: 'price-meta' },
      React.createElement('span', null, `B:${recentBuys} S:${recentSells}`),
      React.createElement('span', null, bias.toUpperCase())
    )
  );
}

// ── Trade Feed ────────────────────────────────────────────── //
function TradeFeed({ trades }) {
  return React.createElement('div', { className: 'card trade-feed' },
    React.createElement('div', { className: 'card-header' },
      React.createElement('span', { className: 'card-title' }, 'Live Trade Feed'),
      React.createElement('span', { className: 'tag tag-live' }, 'LIVE')
    ),
    React.createElement('div', { className: 'card-body overflow-y-lg', style:{padding:'8px 12px'} },
      trades.length === 0
        ? React.createElement('div', { className: 'empty' }, 'Waiting for trades...')
        : trades.slice(0, 50).map((t, i) =>
            React.createElement('div', { key: i, className: 'trade-row' },
              React.createElement('span', { className: 'trade-pair' }, t.symbol),
              React.createElement('span', { className: t.side === 'buy' ? 'trade-buy' : 'trade-sell' },
                t.side === 'buy' ? '▲ BUY' : '▼ SELL'
              ),
              React.createElement('span', { className: 'trade-price' },
                fmt.price(t.price, t.symbol)
              ),
              React.createElement('span', { className: 'trade-vol' },
                fmt.usd(t.volume_usd)
              )
            )
          )
    )
  );
}

// ── Alert Log ─────────────────────────────────────────────── //
function AlertLog({ alerts }) {
  return React.createElement('div', { className: 'card alert-log' },
    React.createElement('div', { className: 'card-header' },
      React.createElement('span', { className: 'card-title' }, 'Signal Alerts'),
      React.createElement('span', { style:{fontFamily:'Share Tech Mono',fontSize:12,color:'var(--yellow)'} },
        alerts.length > 0 ? `${alerts.length} detected` : 'monitoring...'
      )
    ),
    React.createElement('div', { className: 'card-body overflow-y', style:{padding:'10px 12px'} },
      alerts.length === 0
        ? React.createElement('div', { className: 'empty' }, 'No signals yet — watching markets...')
        : alerts.slice(0, 20).map((a, i) =>
            React.createElement('div', {
              key: i,
              className: `alert-row ${signalColor(a.type)}`
            },
              React.createElement('div', { className: 'alert-time' },
                `${signalEmoji(a.type)} ${a.timestamp || ''} — ${a.type}`
              ),
              React.createElement('div', { className: 'alert-msg' }, a.detail || a.message || '')
            )
          )
    )
  );
}

// ── Agent Commentary ──────────────────────────────────────── //
function AgentPanel({ commentary, alertCount }) {
  const latest = commentary && commentary.length > 0 ? commentary[0] : null;

  return React.createElement('div', { className: 'card agent-panel' },
    React.createElement('div', { className: 'card-header' },
      React.createElement('span', { className: 'card-title' }, '🤖 Agent Reasoning'),
      React.createElement('span', { className: 'tag tag-paper' }, `${alertCount} analyses`)
    ),
    React.createElement('div', { className: 'card-body' },
      React.createElement('div', { className: 'commentary-box' },
        latest
          ? React.createElement(React.Fragment, null,
              React.createElement('div', { style:{color:'var(--cyan2)',marginBottom:6,fontSize:11} },
                `[${latest.timestamp}] SIGNAL: ${latest.signal}`
              ),
              React.createElement('div', null,
                latest.text,
                React.createElement('span', { className: 'typing-cursor' })
              )
            )
          : React.createElement(React.Fragment, null,
              'Waiting for market signal to trigger analysis...',
              React.createElement('span', { className: 'typing-cursor' })
            )
      )
    )
  );
}

// ── Portfolio ─────────────────────────────────────────────── //
function PortfolioPanel({ portfolio, futuresPortfolio }) {
  const val = portfolio?.current_value || portfolio?.starting_balance || 10000;
  const start = portfolio?.starting_balance || 10000;
  const pnl = portfolio?.unrealized_pnl || 0;
  const pnlPct = ((val - start) / start) * 100;
  const trades = portfolio?.total_trades || 0;
  const barPct = Math.max(0, Math.min(100, 50 + pnlPct * 10));

  const fVal = futuresPortfolio?.account_value || futuresPortfolio?.starting_balance || 10000;
  const fPnl = futuresPortfolio?.unrealized_pnl || 0;

  return React.createElement('div', { className: 'card portfolio-panel' },
    React.createElement('div', { className: 'card-header' },
      React.createElement('span', { className: 'card-title' }, 'Portfolio'),
      React.createElement('div', { style:{display:'flex',gap:6} },
        React.createElement('span', { className: 'tag tag-paper' }, 'SPOT'),
        React.createElement('span', { className: 'tag tag-futures' }, 'FUTURES')
      )
    ),
    React.createElement('div', { className: 'card-body' },
      React.createElement('div', { className: 'pnl-row' },
        React.createElement('span', { className: 'pnl-label' }, 'SPOT VALUE'),
        React.createElement('span', { className: 'pnl-neu' }, fmt.usd(val))
      ),
      React.createElement('div', { className: 'pnl-row' },
        React.createElement('span', { className: 'pnl-label' }, 'SPOT P&L'),
        React.createElement('span', { className: pnl >= 0 ? 'pnl-pos' : 'pnl-neg' },
          `${fmt.usd(pnl)} (${fmt.pct(pnlPct)})`
        )
      ),
      React.createElement('div', { className: 'pnl-row' },
        React.createElement('span', { className: 'pnl-label' }, 'TRADES'),
        React.createElement('span', { className: 'pnl-neu' }, trades)
      ),
      React.createElement('div', { className: 'pnl-bar-wrap' },
        React.createElement('div', {
          className: 'pnl-bar',
          style: {
            width: `${barPct}%`,
            background: pnl >= 0
              ? 'linear-gradient(90deg, var(--green2), var(--green))'
              : 'linear-gradient(90deg, var(--red2), var(--red))'
          }
        })
      ),
      React.createElement('div', { style:{marginTop:14,paddingTop:10,borderTop:'1px solid var(--border)'} },
        React.createElement('div', { className: 'pnl-row' },
          React.createElement('span', { className: 'pnl-label' }, 'FUTURES VALUE'),
          React.createElement('span', { className: 'pnl-neu' }, fmt.usd(fVal))
        ),
        React.createElement('div', { className: 'pnl-row' },
          React.createElement('span', { className: 'pnl-label' }, 'FUTURES P&L'),
          React.createElement('span', { className: fPnl >= 0 ? 'pnl-pos' : 'pnl-neg' },
            fmt.usd(fPnl)
          )
        )
      )
    )
  );
}

// ── Price Chart ───────────────────────────────────────────── //
function PriceChart({ priceHistory }) {
  const data = priceHistory || [];

  return React.createElement('div', { className: 'card chart-panel' },
    React.createElement('div', { className: 'card-header' },
      React.createElement('span', { className: 'card-title' }, 'BTC/USD Price (session)'),
      React.createElement('span', { style:{fontFamily:'Share Tech Mono',fontSize:11,color:'var(--text3)'} },
        `${data.length} data points`
      )
    ),
    React.createElement('div', { className: 'card-body', style:{padding:'8px'} },
      data.length < 2
        ? React.createElement('div', { className: 'empty', style:{height:160} }, 'Building price history...')
        : React.createElement(ResponsiveContainer, { width:'100%', height: 160 },
            React.createElement(LineChart, { data, margin:{top:5,right:10,left:0,bottom:0} },
              React.createElement(XAxis, {
                dataKey:'time', hide:true
              }),
              React.createElement(YAxis, {
                domain:['auto','auto'],
                tick:{fill:'var(--text3)',fontSize:10,fontFamily:'Share Tech Mono'},
                tickFormatter: v => `$${(v/1000).toFixed(1)}k`,
                width: 55
              }),
              React.createElement(Tooltip, {
                contentStyle:{background:'var(--bg2)',border:'1px solid var(--border2)',borderRadius:3},
                labelStyle:{color:'var(--text3)',fontFamily:'Share Tech Mono',fontSize:11},
                itemStyle:{color:'var(--cyan)',fontFamily:'Share Tech Mono',fontSize:12},
                formatter: v => [fmt.price(v), 'BTC/USD']
              }),
              React.createElement(Line, {
                type:'monotone', dataKey:'price',
                stroke:'var(--cyan)', strokeWidth:1.5,
                dot:false, activeDot:{r:3,fill:'var(--cyan)'}
              })
            )
          )
    )
  );
}

// ── Main App ──────────────────────────────────────────────── //
function App() {
  const [state, setState] = useState(null);
  const [priceHistory, setPriceHistory] = useState([]);
  const [burst, setBurst] = useState(null);
  const prevAlerts = useRef(0);
  const startTime = useRef(Date.now());

  const fetchState = useCallback(async () => {
    try {
      const r = await fetch(`${API}/state`);
      if (!r.ok) return;
      const data = await r.json();
      setState(data);

      // Update price history
      const btcPrice = data?.prices?.['BTC/USD'];
      if (btcPrice) {
        setPriceHistory(prev => {
          const next = [...prev, {
            time: new Date().toLocaleTimeString('en-US',{hour12:false}),
            price: parseFloat(btcPrice)
          }];
          return next.slice(-120); // keep 3 min at 1.5s interval
        });
      }

      // Burst animation on new alert
      const alerts = data?.alerts?.length || 0;
      if (alerts > prevAlerts.current && alerts > 0) {
        const latest = data.alerts[0];
        setBurst(signalEmoji(latest?.type));
        setTimeout(() => setBurst(null), 1500);
      }
      prevAlerts.current = alerts;
    } catch (e) {
      // server not running yet
    }
  }, []);

  useEffect(() => {
    fetchState();
    const id = setInterval(fetchState, POLL);
    return () => clearInterval(id);
  }, [fetchState]);

  const uptime = Math.floor((Date.now() - startTime.current) / 1000);
  const mins = Math.floor(uptime / 60);
  const secs = uptime % 60;

  const trades = state?.trades || [];
  const alerts = state?.alerts || [];
  const commentary = state?.agent_commentary || [];
  const pairs = ['BTC/USD', 'ETH/USD', 'DOG/USD'];

  return React.createElement('div', null,
    // Signal burst overlay
    burst && React.createElement('div', { className: 'signal-burst' }, burst),

    // Header
    React.createElement('div', { className: 'header' },
      React.createElement('div', null,
        React.createElement('div', { className: 'logo' },
          React.createElement('span', null, '⚡'),
          'KRAKEN SENTINEL'
        ),
        React.createElement('div', { className: 'logo-sub' }, 'EVENT-DRIVEN AI TRADING AGENT')
      ),
      React.createElement('div', { className: 'status-bar' },
        React.createElement('div', { className: 'stat' },
          React.createElement('div', { className: 'stat-val' }, state?.trade_count || 0),
          React.createElement('div', { className: 'stat-lbl' }, 'Trades')
        ),
        React.createElement('div', { className: 'sep' }),
        React.createElement('div', { className: 'stat' },
          React.createElement('div', { className: 'stat-val', style:{color:'var(--yellow)'} },
            state?.alert_count || 0
          ),
          React.createElement('div', { className: 'stat-lbl' }, 'Signals')
        ),
        React.createElement('div', { className: 'sep' }),
        React.createElement('div', { className: 'stat' },
          React.createElement('div', { className: 'stat-val', style:{color:'var(--green)'} },
            `${mins}m${String(secs).padStart(2,'0')}s`
          ),
          React.createElement('div', { className: 'stat-lbl' }, 'Uptime')
        ),
        React.createElement('div', { className: 'sep' }),
        React.createElement('div', { style:{display:'flex',alignItems:'center',gap:8} },
          React.createElement('div', { className: 'live-dot' }),
          React.createElement('span', { style:{fontFamily:'Share Tech Mono',fontSize:11,color:'var(--green)'} },
            state ? 'STREAMING' : 'CONNECTING'
          )
        )
      )
    ),

    // Main grid
    React.createElement('div', { className: 'grid' },
      // Price cards row
      React.createElement('div', { className: 'price-cards' },
        ...pairs.map(p => React.createElement(PriceCard, { key:p, pair:p, data:state }))
      ),

      // Trade feed (tall, left)
      React.createElement(TradeFeed, { trades }),

      // Alert log
      React.createElement(AlertLog, { alerts }),

      // Portfolio
      React.createElement(PortfolioPanel, {
        portfolio: state?.portfolio || {},
        futuresPortfolio: state?.futures_portfolio || {}
      }),

      // Chart
      React.createElement(PriceChart, { priceHistory }),

      // Agent commentary
      React.createElement(AgentPanel, {
        commentary,
        alertCount: state?.alert_count || 0
      })
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
